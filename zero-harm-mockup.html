<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Harm 2.0 — Analytics per Sheet (Mockup)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
 :root{--green:#16a34a;--amber:#f59e0b;--red:#dc2626;--blue:#2563eb;--violet:#7c3aed;--cyan:#0891b2;--pink:#db2777;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--brand:#0e7490}
 *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 body{background:var(--bg);color:var(--ink);font-size:13px}
 .wrap{max-width:1320px;margin:0 auto;padding:18px}
 .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
 h1{font-size:22px;font-weight:800;letter-spacing:-.3px} h1 span{color:var(--brand)}
 .sub{color:var(--muted);font-size:12px;margin:2px 0 12px}
 .badge-mock{background:#fef9c3;color:#854d0e;border:1px solid #fde68a;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
 select,.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
 .btn-primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
 .filters{display:flex;gap:8px;flex-wrap:wrap}
 .tabs{display:flex;gap:4px;margin:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
 .tab{padding:9px 14px;border:none;background:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
 .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
 .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
 .chartcard{display:flex;flex-direction:column;min-height:285px}
 .chartcard canvas{flex:1;margin-top:4px}
 .ctitle{font-weight:700;font-size:13px;margin-bottom:2px} .cnote{color:var(--muted);font-size:11px;margin-bottom:6px}
 .grid{display:grid;gap:14px}
 .charts{grid-template-columns:repeat(3,1fr)}
 .kpis{grid-template-columns:repeat(6,1fr);margin-bottom:16px}
 .kpi{position:relative;overflow:hidden}
 .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
 .kpi .n{font-size:22px;font-weight:800;line-height:1.1} .kpi .l{color:var(--muted);font-size:10.5px;margin-top:4px;font-weight:600}
 .c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
 canvas{max-height:210px}
 table{width:100%;border-collapse:collapse;font-size:11.5px}
 th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
 th{background:#f8fafc;font-size:10px;text-transform:uppercase;color:var(--muted)}
 td.c,th.c{text-align:center}
 .tag{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700}
 .g{background:#dcfce7;color:#166534}.a{background:#fef3c7;color:#92400e}.r{background:#fee2e2;color:#991b1b}.b{background:#dbeafe;color:#1e40af}
 .hidden{display:none}.scroll{overflow-x:auto}
 .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
 @media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.c2,.c3,.c4,.charts{grid-template-columns:1fr}}
</style></head>

const charts=[];
function destroyCharts(){charts.forEach(c=>c.destroy());charts.length=0;}
function mkChart(canvas,c){
 let cfg;
 if(c.type==='donut') cfg={type:'doughnut',data:{labels:c.labels,datasets:[{data:c.data,backgroundColor:c.colors}]},options:{maintainAspectRatio:false,cutout:'56%',plugins:{datalabels:PCT(c.data),legend:{position:'bottom'}}}};
 else if(c.type==='line') cfg={type:'line',data:{labels:c.labels,datasets:c.series.map(s=>({label:s[0],data:s[1],borderColor:s[2],backgroundColor:'transparent',tension:.35}))},options:{maintainAspectRatio:false,plugins:{datalabels:{display:false},legend:{display:c.series.length>1}},interaction:{mode:'index',intersect:false}}};
 else if(c.type==='stack') cfg={type:'bar',data:{labels:c.labels,datasets:c.series.map(s=>({label:s[0],data:s[1],backgroundColor:s[2]}))},options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}},plugins:{datalabels:{display:false}}}};
 else cfg={type:'bar',data:{labels:c.labels,datasets:[{data:c.data,backgroundColor:c.colors}]},options:{maintainAspectRatio:false,indexAxis:c.type==='barh'?'y':'x',plugins:{legend:{display:false},datalabels:NUM}}};
 charts.push(new Chart(canvas,cfg));
}

function renderPage(key){
 destroyCharts();
 const p=PAGES[key], el=document.getElementById('page');
 if(p.special==='sap') return renderSAP(el);
 if(p.special==='import') return renderImport(el);
 let html='<div class="grid kpis">'+p.kpis.map(k=>`<div class="card kpi"><div class="n">${k[0]}</div><div class="l">${k[1]}</div></div>`).join('')+'</div>';
 // charts grid (3 kolom konsisten)
 html+='<div class="grid charts">';
 p.charts.forEach((c,i)=>{ const span=Math.min(c.w||1,3); html+=`<div class="card chartcard" style="grid-column:span ${span}"><div class="ctitle">${c.t}</div>${c.n?`<div class="cnote">${c.n}</div>`:''}<canvas id="cv${i}"></canvas></div>`; });
 html+='</div>';
 if(p.table){ html+=`<div class="card scroll" style="margin-top:13px"><div class="ctitle">Contoh Data Mentah (${key})</div><table><thead><tr>${p.table.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${p.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="cnote" style="margin-top:6px">menampilkan 3 dari ribuan baris — versi nyata: filter, cari, paginasi, drill-down.</div></div>`; }
 el.innerHTML=html;
 p.charts.forEach((c,i)=>mkChart(document.getElementById('cv'+i),c));
}

function renderSAP(el){
 const SAP=[
  ['ADING FAHRIZA A','C-020433','PJO',1,1,1,0,0,0,'2/4','-'],['AKHMAD NOOR','C-081396','Section Head',4,4,4,3,2,4,'3/4','80%'],
  ['SYAHRANI','C-027739','Pengawas FMS',7,7,4,7,5,4,'4/4','90%'],['PURI RAHMAN','C-037252','Pengawas',7,7,4,6,7,4,'4/4','75%'],
  ['M. IRFAN','C-048185','Pengawas Opr',7,7,4,2,1,0,'1/4','40%'],['BAGUS AJI','C-051242','Group Leader',5,5,3,5,5,3,'4/4','95%']];
 const col=p=>p>=80?C.green:p>=50?C.amber:C.red;
 const cell=(a,t)=>`<td class="c"><span class="tag ${a>=t?'g':a>0?'a':'r'}">${a}/${t}</span></td>`;
 const rows=SAP.map((s,i)=>{const tgt=s[3]+s[4]+s[5],akt=s[6]+s[7]+s[8],pct=Math.round(akt/tgt*100);
  return `<tr><td class="c">${i+1}</td><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td class="c">${s[3]}/${s[4]}/${s[5]}</td>${cell(s[6],s[3])}${cell(s[7],s[4])}${cell(s[8],s[5])}<td class="c">${s[9]}</td><td class="c">${s[10]}</td><td class="c"><b style="color:${col(pct)}">${pct}%</b></td></tr>`;}).join('');
 el.innerHTML=`<div class="grid c2" style="margin-bottom:13px"><div class="card"><div class="ctitle">SAP — Safety Accountability Program</div><div class="cnote">Target & aktual per pengawas/minggu (Hazard·Inspeksi·Observasi)+Kehadiran+TTA, dihitung dari data import (cocok NIK+Week).</div></div><div class="card"><div class="ctitle">Distribusi Capaian</div><canvas id="cvS" style="max-height:140px"></canvas></div></div>
  <div class="card scroll"><table><thead><tr>${['No','Nama','NIK','Jabatan','Tgt H/I/O','Hazard','Inspeksi','Observasi','Hadir','TTA','% SAP'].map(h=>`<th class="c">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
 charts.push(new Chart(document.getElementById('cvS'),{type:'bar',data:{labels:['<50%','50-79%','≥80%'],datasets:[{data:[1,2,3],backgroundColor:[C.red,C.amber,C.green]}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},datalabels:NUM}}}));
}
function renderImport(el){
 el.innerHTML=`<div class="card"><div class="ctitle" style="font-size:15px">Import Export iSafe / FMS</div><div class="cnote">Upload export berkala; app simpan & hitung ulang semua sheet + SAP.</div>
  <div class="scroll"><table><thead><tr><th>Sheet</th><th class="c">Baris</th><th>Periode</th><th class="c">Status</th></tr></thead><tbody>
  <tr><td>Hazard</td><td class="c">2.658</td><td>W1–W21</td><td class="c"><span class="tag g">siap</span></td></tr>
  <tr><td>Inspeksi</td><td class="c">1.396</td><td>W1–W21</td><td class="c"><span class="tag g">siap</span></td></tr>
  <tr><td>Observasi</td><td class="c">1.761</td><td>W1–W21</td><td class="c"><span class="tag g">siap</span></td></tr>
  <tr><td>Attendance</td><td class="c">999</td><td>W1–W21</td><td class="c"><span class="tag g">siap</span></td></tr>
  <tr><td>FMS</td><td class="c">19.124</td><td>W18–W21</td><td class="c"><span class="tag a">besar</span></td></tr></tbody></table></div>
  <div style="margin-top:12px"><button class="btn btn-primary" onclick="toast('✓ 25.938 baris di-import & dihitung')">Import & Hitung</button></div></div>`;
}

// tabs
const tabsEl=document.getElementById('tabs');
Object.keys(PAGES).forEach((k,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=PAGES[k].label;b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');renderPage(k);};tabsEl.appendChild(b);});
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400);}
renderPage('ringkasan');
</script>
